# Talentum — mobile/android/gradle.properties
# Responsabilidade: configura recursos e comportamento do Gradle no build Android.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Esta opção de Kotlin interno foi adicionada automaticamente pelo migrador do Flutter.
android.builtInKotlin=false
# Esta opção da nova DSL foi adicionada automaticamente pelo migrador do Flutter.
android.newDsl=false

# Esta segunda declaração prevalece sobre a primeira; mantenha uma única definição para evitar ambiguidade.
org.gradle.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Limita o paralelismo e desativa processos persistentes do Gradle neste ambiente de build.
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
