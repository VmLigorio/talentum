# Talentum — mobile/pubspec.yaml
# Responsabilidade: declara metadados, dependências e configurações do app Flutter.
name: talentum_mobile
description: Aplicativo do cliente Talentum.
publish_to: "none"
version: 0.1.0+1

environment:
  # A faixa mínima declarada diverge do SDK exigido pelo lockfile (achado 180).
  sdk: ">=3.3.0 <4.0.0"

# Pacotes usados pelo aplicativo em execução, além do Flutter SDK.
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^11.0.3
  flutter_secure_storage: ^10.3.4
  local_auth: ^3.0.2
  printing: ^5.14.3
  shared_preferences: ^2.3.5

# Ferramentas usadas para testar e analisar o código durante o desenvolvimento.
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  # image 4.11.0 usa ZLibDecoder.decodeLazy, incluído a partir do archive 4.4.0.
  archive: ^4.4.0
  # Mantém a compilação Android independente da cadeia JNI/NDK opcional.
  path_provider_android: 2.2.22

flutter:
  uses-material-design: true
  # Inclui a marca usada pela interface para que Image.asset consiga carregá-la.
  assets:
    - assets/brand/talentum-moeda-prata.png
