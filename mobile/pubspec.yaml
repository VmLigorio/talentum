name: talentum_mobile
description: Aplicativo do cliente Talentum.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^11.0.3
  flutter_secure_storage: ^10.3.4
  local_auth: ^3.0.2
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  # Keeps the Android build independent of the optional JNI/NDK toolchain.
  path_provider_android: 2.2.22

flutter:
  uses-material-design: true
