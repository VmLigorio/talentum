<!DOCTYPE html>
<html>
<head>
  <!--
    Se o app Web for servido em um caminho diferente da raiz, ajuste o valor de
    href abaixo para refletir o caminho-base usado na hospedagem.

    Para funcionar corretamente, o caminho informado precisa começar e terminar
    com uma barra "/".

    Mais detalhes:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    Este espaço reservado para o caminho-base será substituído pelo valor
    informado em `--base-href` ao executar `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!-- Codificação, compatibilidade, descrição e cor do tema do navegador. -->
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Planejamento financeiro com propósito.">
  <meta name="theme-color" content="#17324D">

  <!-- Metadados e ícones usados quando o app é aberto em dispositivos iOS. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Talentum">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Ícone exibido na aba do navegador. -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Talentum</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    O script "flutter_bootstrap.js" pode ser personalizado para configurar o
    carregador Flutter ou exibir feedback durante a inicialização do app.

    Mais detalhes:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
