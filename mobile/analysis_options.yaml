# Talentum — mobile/analysis_options.yaml
# Responsabilidade: define as regras de análise estática do código Dart.
# Configura a análise estática do Dart para encontrar erros, avisos e práticas recomendadas.
#
# Os mesmos avisos aparecem em editores compatíveis e podem ser consultados com `flutter analyze`.

# Ativa o conjunto recomendado de regras para aplicativos, pacotes e plugins Flutter.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  # Personalize aqui regras herdadas ou adicionais; a lista oficial está em https://dart.dev/lints.
  #
  # Uma regra também pode ser suprimida localmente com `// ignore:` ou `// ignore_for_file:`.
  rules:
    # avoid_print: false  # Remova o comentário para desativar a regra `avoid_print`.
    # prefer_single_quotes: true  # Remova o comentário para ativar a regra `prefer_single_quotes`.

# Referência adicional sobre as opções do analisador: https://dart.dev/guides/language/analysis-options
