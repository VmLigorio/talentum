# Talentum — docker-compose.production.yml
# Responsabilidade: define a composição de serviços para produção.
services:
  # Banco sem porta publicada, acessível apenas pela rede interna do Compose.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env.production}
    expose:
      - "5432"
    volumes:
      - talentum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # Contador compartilhado de tentativas de login, protegido por senha.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env.production}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    expose:
      - "6379"
    volumes:
      - talentum_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  # O hostname clamav é usado por CLAMAV_HOST; o container não tem healthcheck de prontidão.
  # A inicialização de assinaturas pode atrasar a disponibilidade do scanner (achado 37).
  clamav:
    image: clamav/clamav:1.4.6
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - talentum_clamavdata:/var/lib/clamav

  # API com filesystem somente de leitura e acesso local pelo proxy reverso.
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Carrega os segredos e parâmetros da API do arquivo de produção selecionado.
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    # Publica a API somente no loopback do host para acesso pelo proxy reverso.
    ports:
      - "127.0.0.1:${API_BIND_PORT:-8100}:8000"
    expose:
      - "8000"
    volumes:
      - talentum_storage:/app/backend/storage
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # A URL define o Host 127.0.0.1, que deve estar entre os TRUSTED_HOSTS da API.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    # Só aguarda PostgreSQL e Redis; o readiness também não monitora o ClamAV (achado 37).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

# Mantém dados do banco, Redis, antivírus e arquivos enviados fora dos containers.
volumes:
  talentum_pgdata:
  talentum_redisdata:
  talentum_clamavdata:
  talentum_storage:
