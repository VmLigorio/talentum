name: Talentum security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt bandit pip-audit
      - name: Compile backend
        run: python -m compileall -q backend/app backend/alembic
      - name: Run tests
        working-directory: backend
        run: pytest -q
      - name: Static security scan
        run: bandit -q -r backend/app -x backend/app/__pycache__
      - name: Dependency vulnerability scan
        run: pip-audit -r backend/requirements.txt
