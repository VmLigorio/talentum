name: Talentum security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mobile-react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-react-native-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-react-native-prototype/package-lock.json
      - name: Install React Native dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run React Native tests
        run: npm test

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter app
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Save Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: talentum-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: talentum_test
          POSTGRES_USER: talentum_test
          POSTGRES_PASSWORD: phase9_test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talentum_test -d talentum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://talentum_test:phase9_test_only_password@localhost:5432/talentum_test
      TEST_DATABASE_URL: postgresql+psycopg://talentum_test:phase9_test_only_password@localhost:5432/talentum_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt bandit pip-audit
      - name: Compile backend
        run: python -m compileall -q backend/app backend/alembic
      - name: Apply database migrations to the test database
        working-directory: backend
        run: alembic upgrade head
      - name: Run tests
        working-directory: backend
        run: pytest -q
      - name: Static security scan
        run: bandit -q -r backend/app -x backend/app/__pycache__
      - name: Dependency vulnerability scan
        run: pip-audit -r backend/requirements.txt
