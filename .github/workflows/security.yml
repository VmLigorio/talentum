# Executa as verificações em cada alteração e permite gerar um APK manualmente.
name: Talentum security checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      api_url:
        # Permite apontar o APK manual para a API acessível no ambiente de teste.
        description: Endereço da API incluído no APK de teste
        required: false
        type: string

# Restringe o token padrão do workflow à leitura do repositório.
permissions:
  contents: read

jobs:
  # Confere tipos e cenários de sessão, dinheiro e carregamento do protótipo.
  mobile-react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-react-native-prototype
    steps:
      # Recupera os arquivos versionados para as etapas seguintes do job.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-react-native-prototype/package-lock.json
      # Instala as versões do lockfile; esta etapa não audita vulnerabilidades conhecidas no npm.
      - name: Install React Native dependencies
        run: npm ci
      # Valida tipos e executa a suíte automatizada do app.
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run React Native tests
        run: npm test

  # Analisa, testa e gera o APK de depuração usado no fluxo mobile.
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      # Prepara o código; sem flutter-version, a action usa a release mais recente do canal estável.
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Resolve as dependências declaradas pelo app antes das verificações.
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter app
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      # Prioriza o endereço informado manualmente, depois a variável do repositório,
      # e por fim usa um endereço local de desenvolvimento como fallback.
      - name: Build Android debug APK
        env:
          TALENTUM_API_URL: ${{ inputs.api_url || vars.TALENTUM_API_URL || 'http://192.168.10.16:8001' }}
        run: flutter build apk --debug --dart-define="API_URL=${TALENTUM_API_URL}"
      # Mantém o artefato de teste disponível por sete dias após a execução.
      - name: Save Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: talentum-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # Sobe PostgreSQL isolado para aplicar migrações e validar a API.
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: talentum_test
          POSTGRES_USER: talentum_test
          POSTGRES_PASSWORD: phase9_test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talentum_test -d talentum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://talentum_test:phase9_test_only_password@localhost:5432/talentum_test
      TEST_DATABASE_URL: postgresql+psycopg://talentum_test:phase9_test_only_password@localhost:5432/talentum_test
    steps:
      # Recupera o código e instala Python compatível com a imagem da API.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Inclui as ferramentas de análise usadas apenas neste workflow.
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt bandit pip-audit
      # Detecta erros de sintaxe antes de tocar o banco de teste.
      - name: Compile backend
        run: python -m compileall -q backend/app backend/alembic
      # Confirma que todas as revisões Alembic podem criar o esquema atual.
      - name: Apply database migrations to the test database
        working-directory: backend
        run: alembic upgrade head
      # Executa os testes de backend contra o PostgreSQL isolado deste job.
      - name: Run tests
        working-directory: backend
        run: pytest -q
      # Analisa padrões de segurança no código da aplicação.
      - name: Static security scan
        run: bandit -q -r backend/app -x backend/app/__pycache__
      # Consulta vulnerabilidades conhecidas nas dependências resolvidas.
      - name: Dependency vulnerability scan
        run: pip-audit -r backend/requirements.txt
